[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truehold-agents"
version = "0.1.0"
description = "Separate TrueHold crypto and Wellness agents. Crypto alerts stay crypto/macro; Wellness alerts always include the full business-inbox snapshot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
truehold-crypto-agent = "truehold.crypto_agent.cli:main"
truehold-wellness-agent = "truehold.wellness_agent.cli:main"

[tool.setuptools.packages.find]
include = ["truehold*"]

[tool.setuptools.package-data]
"truehold.crypto_agent" = ["data/*.json"]
"truehold.wellness_agent" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
