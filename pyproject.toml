[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-north"
version = "0.1.0"
description = "Mr North — TrueHold crypto agent. Sends crypto/macro alerts with the current geopolitical/market catalyst briefing. TrueHold Wellness is a separate agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mr-north = "mr_north.cli:main"

[tool.setuptools.packages.find]
include = ["mr_north*"]

[tool.setuptools.package-data]
"mr_north" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
