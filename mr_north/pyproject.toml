[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-north"
version = "0.1.0"
description = "Agent North — TrueHold market watcher. Speedy Telegram reports when source data changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mr-north = "mr_north.cli:main"

# This folder is both the Docker build context and the Python package tree.
# pip install from mr_north/ maps package name mr_north onto this directory.
[tool.setuptools]
packages = ["mr_north"]

[tool.setuptools.package-dir]
"mr_north" = "."

[tool.setuptools.package-data]
"mr_north" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
