# Cardano Preprod demo node.
#
# Base file: IntersectMBO/cardano-node docker-compose.yml
#   https://github.com/IntersectMBO/cardano-node/blob/11.1.3/docker-compose.yml
# Scripts-mode NETWORK=preprod (image-bundled official configs):
#   https://github.com/IntersectMBO/cardano-node/blob/11.1.3/nix/docker/README.md
# Preprod configs compatible with node 11.1.3:
#   https://book.world.dev.cardano.org/env-preprod.html
# Preprod networkMagic 1 from the image's shelley-genesis.json.
#
# NETWORK is hardcoded to preprod. Do not default this file to mainnet.

name: cardano-preprod-demo

services:
  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:11.1.3@sha256:c526d01a6d5c866a05109f0e79cca6a4c0e90fd359f846cc983a788f320bf570
    container_name: cardano-preprod-node
    environment:
      - NETWORK=preprod
    volumes:
      - preprod-node-db:/data/db
      - ./ipc:/ipc
    # Host network: Docker bridge timed out to Preprod peers (nc 3.139.241.28:3001)
    # while the same host TCP path succeeded. Official compose uses the default
    # bridge; this override is only so the node can actually fetch blocks.
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  cardano-submit-api:
    image: ghcr.io/intersectmbo/cardano-submit-api:11.1.3@sha256:1b277c73098aef0270e30a1169d922e7dbc9db8db2fc0a9952136dc86635cac4
    container_name: cardano-preprod-submit-api
    environment:
      - NETWORK=preprod
    depends_on:
      - cardano-node
    volumes:
      - ./ipc:/ipc
    ports:
      - "8090:8090"
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

volumes:
  preprod-node-db:
    name: cardano-preprod-node-db
