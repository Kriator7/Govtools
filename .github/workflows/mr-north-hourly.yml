name: mr-north-hourly

# Durable timer for the BLS breakdown and the larger catalyst briefing.
# In-process loops die when the cloud VM sleeps.
# GitHub only runs `schedule` on the default branch (main).
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: mr-north-hourly
  cancel-in-progress: true

jobs:
  hourly-bls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require North Telegram
        env:
          NORTH_TELEGRAM_BOT_TOKEN: ${{ secrets.NORTH_TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$NORTH_TELEGRAM_BOT_TOKEN" ]; then
            echo "Set repository secret NORTH_TELEGRAM_BOT_TOKEN for @Mr_North_bot." >&2
            echo "Do not use @THWellness_bot or @PirateEye_bot." >&2
            exit 1
          fi
      - name: Install Mr North
        run: python -m pip install -e ./mr_north
      - name: Send larger catalyst briefing to both chats
        env:
          NORTH_TELEGRAM_BOT_TOKEN: ${{ secrets.NORTH_TELEGRAM_BOT_TOKEN }}
          NORTH_TELEGRAM_CHAT_ID: ${{ secrets.NORTH_TELEGRAM_CHAT_ID }}
          NORTH_TELEGRAM_GROUP_CHAT_ID: ${{ secrets.NORTH_TELEGRAM_GROUP_CHAT_ID }}
          NORTH_TELEGRAM_CHAT_IDS: ${{ secrets.NORTH_TELEGRAM_CHAT_IDS }}
          NORTH_TELEGRAM_USERNAME: Mr_North_bot
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$NORTH_TELEGRAM_GROUP_CHAT_ID" ]; then
            export NORTH_TELEGRAM_GROUP_CHAT_ID="-1003939359929"
          fi
          python -m mr_north catalyst
      - name: Send hourly BLS breakdown to both chats
        env:
          NORTH_TELEGRAM_BOT_TOKEN: ${{ secrets.NORTH_TELEGRAM_BOT_TOKEN }}
          NORTH_TELEGRAM_CHAT_ID: ${{ secrets.NORTH_TELEGRAM_CHAT_ID }}
          NORTH_TELEGRAM_GROUP_CHAT_ID: ${{ secrets.NORTH_TELEGRAM_GROUP_CHAT_ID }}
          NORTH_TELEGRAM_CHAT_IDS: ${{ secrets.NORTH_TELEGRAM_CHAT_IDS }}
          NORTH_TELEGRAM_USERNAME: Mr_North_bot
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$NORTH_TELEGRAM_GROUP_CHAT_ID" ]; then
            export NORTH_TELEGRAM_GROUP_CHAT_ID="-1003939359929"
          fi
          python -m mr_north hourly
