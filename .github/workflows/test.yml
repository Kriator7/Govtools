name: test

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  realtor-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtor-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install realtor-agent
        run: python -m pip install -e ".[dev]"
      - name: Test realtor-agent
        run: python -m pytest
