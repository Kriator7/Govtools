[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truehold-wellness"
version = "0.1.0"
description = "TrueHold Wellness order-email workflow. Telegram: @Npeppers_bot only. Not realtor-agent and not Mr North."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
truehold-wellness = "thw.cli:main"

[tool.setuptools.packages.find]
include = ["thw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
