[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "7.0.0"
description = "JARVIS Mark VII executive assistant. n8n schedules work. PostgreSQL stores records. Qdrant holds separated memory collections. Ollama stays the local inference engine."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["static/*", "workflows/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
